<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Voice Agent</title>
    <style>
        :root {
            --primary: #4F46E5;
            --primary-hover: #4338CA;
            --bg: #0F172A;
            --surface: #1E293B;
            --text: #F8FAFC;
        }
        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background: var(--surface);
            padding: 2rem;
            border-radius: 1rem;
            box-shadow: 0 10px 15px -3px rgba(0,0,0,0.5);
            text-align: center;
            width: 100%;
            max-width: 400px;
        }
        h1 {
            font-size: 1.5rem;
            margin-bottom: 1.5rem;
            font-weight: 600;
        }
        .input-group {
            margin-bottom: 1.5rem;
        }
        input {
            width: 100%;
            padding: 0.75rem;
            border-radius: 0.5rem;
            border: 1px solid #334155;
            background: #0F172A;
            color: white;
            font-size: 1rem;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.2s;
        }
        input:focus {
            border-color: var(--primary);
        }
        button {
            width: 100%;
            padding: 0.75rem;
            border-radius: 0.5rem;
            border: none;
            background: var(--primary);
            color: white;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
        }
        button:hover {
            background: var(--primary-hover);
        }
        button:active {
            transform: scale(0.98);
        }
        #status {
            margin-top: 1rem;
            font-size: 0.875rem;
            color: #94A3B8;
            min-height: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Autonomous AI Voice Agent</h1>
        <div class="input-group">
            <input type="text" id="phoneNumber" value="8688664337" placeholder="Enter phone number">
        </div>
        <button id="callButton">Initiate Call</button>
        <div id="status"></div>
    </div>

    <script>
        document.getElementById('callButton').addEventListener('click', async () => {
            let phoneNumber = document.getElementById('phoneNumber').value;
            
            // FIX 1: E.164 Phone Number Sanitization on Frontend
            phoneNumber = phoneNumber.replace(/[\s\-()]/g, '');
            if (!phoneNumber.startsWith('+')) {
                phoneNumber = '+91' + phoneNumber;
            }

            const statusEl = document.getElementById('status');
            const button = document.getElementById('callButton');
            
            button.disabled = true;
            statusEl.textContent = 'Initiating call...';
            statusEl.style.color = '#94A3B8';
            
            try {
                const response = await fetch('/start-call', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ to: phoneNumber })
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    statusEl.textContent = 'Call initiated successfully! Call SID: ' + data.callSid;
                    statusEl.style.color = '#34D399'; // green
                } else {
                    statusEl.textContent = 'Failed: ' + (data.error || 'Unknown error');
                    statusEl.style.color = '#F87171'; // red
                }
            } catch (error) {
                statusEl.textContent = 'Error: ' + error.message;
                statusEl.style.color = '#F87171'; // red
            } finally {
                button.disabled = false;
            }
        });
    </script>
</body>
</html>
