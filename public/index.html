<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sales Assistant</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #000000;
            --primary-hover: #333333;
            --bg-start: #F9FAFB;
            --bg-end: #F3F4F6;
            --surface: rgba(255, 255, 255, 0.7);
            --text-main: #111827;
            --text-muted: #6B7280;
            --border: rgba(229, 231, 235, 0.8);
            --success: #059669;
            --error: #DC2626;
        }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(135deg, var(--bg-start) 0%, var(--bg-end) 100%);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-image: radial-gradient(#e5e7eb 1px, transparent 1px);
            background-size: 20px 20px;
        }
        .container {
            background: var(--surface);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 3rem 2.5rem;
            border-radius: 1.5rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.05), 0 0 0 1px rgba(0,0,0,0.02);
            text-align: center;
            width: 100%;
            max-width: 420px;
            border: 1px solid rgba(255, 255, 255, 0.6);
        }
        h1 {
            font-size: 1.875rem;
            margin-bottom: 0.5rem;
            font-weight: 700;
            letter-spacing: -0.03em;
            background: linear-gradient(to right, #111827, #4B5563);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        p.subtitle {
            color: var(--text-muted);
            font-size: 0.95rem;
            margin-top: 0;
            margin-bottom: 2.5rem;
            line-height: 1.5;
            font-weight: 400;
        }
        .input-group {
            margin-bottom: 1.5rem;
            position: relative;
        }
        input {
            width: 100%;
            padding: 1rem 1.25rem;
            border-radius: 1rem;
            border: 1px solid var(--border);
            background: rgba(255, 255, 255, 0.9);
            color: var(--text-main);
            font-size: 1.05rem;
            font-family: inherit;
            box-sizing: border-box;
            outline: none;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: inset 0 2px 4px 0 rgba(0, 0, 0, 0.02);
        }
        input::placeholder {
            color: #9CA3AF;
            font-weight: 300;
        }
        input:focus {
            border-color: #D1D5DB;
            box-shadow: 0 0 0 4px rgba(0, 0, 0, 0.05);
            background: #FFFFFF;
        }
        button {
            width: 100%;
            padding: 1rem;
            border-radius: 1rem;
            border: 1px solid rgba(0,0,0,0.1);
            background: var(--primary);
            color: white;
            font-size: 1.05rem;
            font-weight: 500;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }
        button:hover:not(:disabled) {
            background: var(--primary-hover);
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        }
        button:active:not(:disabled) {
            transform: translateY(0);
            box-shadow: 0 2px 4px -1px rgba(0, 0, 0, 0.1);
        }
        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        #status {
            margin-top: 1.5rem;
            font-size: 0.9rem;
            font-weight: 500;
            color: var(--text-muted);
            min-height: 20px;
            transition: opacity 0.3s;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Sales Assistant</h1>
        <p class="subtitle">Enter a phone number below to instantly connect with one of our assistants.</p>
        
        <div class="input-group">
            <input type="text" id="phoneNumber" value="" placeholder="e.g. +91 9876543210">
        </div>
        <button id="callButton">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path>
            </svg>
            Initiate Call
        </button>
        <div id="status"></div>
    </div>

    <script>
        document.getElementById('callButton').addEventListener('click', async () => {
            let phoneNumber = document.getElementById('phoneNumber').value;
            
            if (!phoneNumber) {
                const statusEl = document.getElementById('status');
                statusEl.textContent = 'Please enter a phone number.';
                statusEl.style.color = 'var(--error)';
                return;
            }

            // E.164 Phone Number Sanitization
            phoneNumber = phoneNumber.replace(/[\s\-()]/g, '');
            if (!phoneNumber.startsWith('+')) {
                phoneNumber = '+91' + phoneNumber;
            }

            const statusEl = document.getElementById('status');
            const button = document.getElementById('callButton');
            
            button.disabled = true;
            statusEl.textContent = 'Initiating call...';
            statusEl.style.color = 'var(--text-muted)';
            
            try {
                const response = await fetch('/start-call', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ to: phoneNumber })
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    statusEl.textContent = 'Call initiated successfully! Connecting...';
                    statusEl.style.color = 'var(--success)';
                } else {
                    statusEl.textContent = 'Failed: ' + (data.error || 'Unknown error');
                    statusEl.style.color = 'var(--error)';
                }
            } catch (error) {
                statusEl.textContent = 'Error: ' + error.message;
                statusEl.style.color = 'var(--error)';
            } finally {
                button.disabled = false;
            }
        });
    </script>
</body>
</html>
